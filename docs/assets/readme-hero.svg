<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Open Bot — a team of AI coworkers at one desk</title>
  <desc id="desc">A dark desktop workspace with a coworker roster, a collaborative conversation, and a live private browser.</desc>
