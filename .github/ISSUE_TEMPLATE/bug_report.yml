name: Bug report
description: Report a reproducible Open Bot problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach API keys, OAuth files, service-account JSON, databases, browser profiles, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Open Bot version
      placeholder: 0.1.7
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Installer,
          Provider sign-in,
          Models,
          Chat,
          Search or Research,
          Private computer,
          Vendor computer,
          Routines,
          Other,
        ]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the selected provider and model, but redact account identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private prompts, account identifiers, and personal data.
          required: true
