<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Bot control evidence</title>
    <style>
      :root { --fixture-bg: #181818; --fixture-text: #eee; --fixture-side: #202020; --fixture-card: #2b2b2b; --fixture-muted: #bbb; --fixture-border: #303030; --fixture-composer: #252525; --fixture-copy: #777; --fixture-heading: #aaa; }
      :root[data-theme="light"] { --fixture-bg: #f4f5f7; --fixture-text: #202124; --fixture-side: #eceef1; --fixture-card: #fff; --fixture-muted: #4f5865; --fixture-border: #d4d8de; --fixture-composer: #fff; --fixture-copy: #667080; --fixture-heading: #4f5865; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--fixture-bg); color: var(--fixture-text); }
      body { display: grid; grid-template-columns: 236px 1fr; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
      .fixture-sidebar { min-width: 0; padding: 46px 12px 12px; border-right: 1px solid var(--fixture-border); background: var(--fixture-side); }
      .fixture-sidebar strong { display: block; padding: 8px; }
      .fixture-sidebar div { margin-top: 5px; padding: 9px; border-radius: 8px; background: var(--fixture-card); color: var(--fixture-muted); }
      .fixture-main { position: relative; display: grid; grid-template-rows: 1fr auto; min-width: 0; color: var(--fixture-copy); }
      .fixture-main::before { content: "Codex Bot  •  Grok 0.20 shell preserved"; position: absolute; top: 17px; left: 24px; color: var(--fixture-heading); }
      .fixture-main p { align-self: center; justify-self: center; max-width: 360px; text-align: center; line-height: 1.6; }
      .fixture-composer { margin: 0 auto 20px; width: min(720px, calc(100% - 40px)); padding: 10px; border: 1px solid var(--fixture-border); border-radius: 18px; background: var(--fixture-composer); }
      :root[data-layout="narrow"] .fixture-composer { width: min(380px, calc(100% - 40px)); }
      .fixture-composer textarea { box-sizing: border-box; width: 100%; min-height: 56px; resize: none; color: var(--fixture-text); background: transparent; border: 0; outline: 0; }
    </style>
    <link rel="stylesheet" href="../../src/renderer/codex-ui.css" />
    <script>
      const params = new URLSearchParams(location.search);
      document.documentElement.dataset.theme = params.get("theme") === "light" ? "light" : "dark";
      document.documentElement.dataset.layout = params.get("layout") === "narrow" ? "narrow" : "wide";
      const BOT_ID = "bot-11111111-1111-4111-8111-111111111111";
      const bot = Object.freeze({ botId: BOT_ID, name: "New Bot", runtime: Object.freeze({ state: "ready" }) });
      const requestedPower = params.get("effort") || "medium";
      const requestedEffort = requestedPower === "terra-light" || requestedPower === "sol-light"
        ? "low"
        : requestedPower;
      const requestedModel = requestedPower === "terra-light"
        ? "gpt-5.6-terra"
        : requestedPower === "ultra-code" ? "claude-fable-5" : "gpt-5.6-sol";
      const requestedServiceTier = params.get("tier") === "priority"
        ? "priority"
        : null;
      let selection = Object.freeze({
        botId: BOT_ID,
        provider: requestedModel.startsWith("claude-") ? "cliproxy-anthropic" : "openai-codex",
        model: requestedModel,
        reasoningEffort: requestedEffort,
        serviceTier: requestedServiceTier,
        catalogGeneration: requestedModel.startsWith("claude-") ? 1 : 8,
        generation: 1,
      });
      window.codexBots = Object.freeze({
        async list() { return [bot]; },
        async create() { return bot; },
        async rename(_botId, name) { return Object.freeze({ ...bot, name }); },
        async retryRuntime() { return bot; },
        onChanged() { return () => {}; },
      });
      window.codexRuntime = Object.freeze({
        async selectBot() { return selection; },
        async readModel() { return selection; },
        async selectModel(next) {
          selection = Object.freeze({
            ...next,
            provider: next.model.startsWith("claude-") ? "cliproxy-anthropic" : "openai-codex",
            catalogGeneration: next.model.startsWith("claude-") ? 1 : 8,
            generation: selection.generation + 1,
          });
          return selection;
        },
      });
      window.codexAccount = Object.freeze({
        async catalog() {
          const tier = Object.freeze({ id: "priority", name: "Fast", description: "1.5x speed" });
          const catalogMode = params.get("catalog") || "full";
          const solName = catalogMode === "long"
            ? "GPT-5.6 Sol — Authoritative Production Reasoning Model With A Deliberately Long Native Name"
            : "GPT-5.6 Sol";
          const models = catalogMode === "minimal"
            ? [Object.freeze({ id: "gpt-5.6-sol", displayName: solName, defaultReasoningEffort: "medium", defaultServiceTier: null, serviceTiers: Object.freeze([tier]), supportedReasoningEfforts: Object.freeze(["medium"]), isDefault: true })]
            : [
              Object.freeze({ id: "gpt-5.6-terra", displayName: "GPT-5.6 Terra", defaultReasoningEffort: "low", defaultServiceTier: null, serviceTiers: Object.freeze([tier]), supportedReasoningEfforts: Object.freeze(["low", "medium", "high", "xhigh", "max", "ultra"]), isDefault: false }),
              Object.freeze({ id: "gpt-5.6-sol", displayName: solName, defaultReasoningEffort: "medium", defaultServiceTier: null, serviceTiers: Object.freeze([tier]), supportedReasoningEfforts: Object.freeze(["low", "medium", "high", "xhigh", "max", "ultra"]), isDefault: true }),
            ];
          return Object.freeze({
            generation: 8,
            status: "ready",
            models: Object.freeze(models),
          });
        },
      });
    </script>
    <script src="../../src/renderer/model-controls.js" defer></script>
    <script src="../../src/renderer/reasoning-control.js" defer></script>
    <script src="../../src/renderer/bot-runtime-ui.js" defer></script>
  </head>
  <body>
    <aside class="fixture-sidebar" data-codex-bot-sidebar-host><strong>Codex Bot</strong><div>New Bot</div><div>Plugins</div><div>Routines</div><div>Settings</div></aside>
    <main class="fixture-main"><p>Stock conversation, attachment, skill, connector, approval, computer, and group-chat surfaces remain in the underlying 0.20 shell.</p><form class="fixture-composer" data-codex-bot-composer-host><textarea placeholder="Ask anything, or drop a file."></textarea></form></main>
  </body>
</html>
