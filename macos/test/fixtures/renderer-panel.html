<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Bot control evidence</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #181818; color: #eee; }
      body { display: grid; grid-template-columns: 236px 1fr; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
      .fixture-sidebar { min-width: 0; padding: 46px 12px 12px; border-right: 1px solid #303030; background: #202020; }
      .fixture-sidebar strong { display: block; padding: 8px; }
      .fixture-sidebar div { margin-top: 5px; padding: 9px; border-radius: 8px; background: #2b2b2b; color: #bbb; }
      .fixture-main { position: relative; display: grid; grid-template-rows: 1fr auto; min-width: 0; color: #777; }
      .fixture-main::before { content: "Codex Bot  •  Grok 0.20 shell preserved"; position: absolute; top: 17px; left: 24px; color: #aaa; }
      .fixture-main p { align-self: center; justify-self: center; max-width: 360px; text-align: center; line-height: 1.6; }
      .fixture-composer { margin: 0 auto 20px; width: min(720px, calc(100% - 40px)); padding: 10px; border: 1px solid #3a3a3a; border-radius: 18px; background: #252525; }
      .fixture-composer textarea { box-sizing: border-box; width: 100%; min-height: 56px; resize: none; color: #eee; background: transparent; border: 0; outline: 0; }
    </style>
    <link rel="stylesheet" href="../../src/renderer/codex-ui.css" />
    <script>
      const BOT_ID = "bot-11111111-1111-4111-8111-111111111111";
      const bot = Object.freeze({ botId: BOT_ID, name: "New Bot", runtime: Object.freeze({ state: "ready" }) });
      window.codexBots = Object.freeze({
        async list() { return [bot]; },
        async create() { return bot; },
        async rename(_botId, name) { return Object.freeze({ ...bot, name }); },
        async retryRuntime() { return bot; },
        onChanged() { return () => {}; },
      });
      window.codexRuntime = Object.freeze({
        async selectBot() { return BOT_ID; },
        async selectModel(selection) { return selection; },
      });
    </script>
    <script src="../../src/renderer/model-controls.js" defer></script>
    <script src="../../src/renderer/reasoning-control.js" defer></script>
    <script src="../../src/renderer/bot-runtime-ui.js" defer></script>
  </head>
  <body>
    <aside class="fixture-sidebar" data-codex-bot-sidebar-host><strong>Codex Bot</strong><div>New Bot</div><div>Plugins</div><div>Routines</div><div>Settings</div></aside>
    <main class="fixture-main"><p>Stock conversation, attachment, skill, connector, approval, computer, and group-chat surfaces remain in the underlying 0.20 shell.</p><form class="fixture-composer" data-codex-bot-composer-host><textarea placeholder="Ask anything, or drop a file."></textarea></form></main>
    <script>
      window.addEventListener("load", () => {
        const params = new URLSearchParams(location.search);
        const effort = params.get("effort") || "medium";
        const model = document.querySelector(".codex-model-select");
        const slider = document.querySelector(".codex-reasoning-input");
        if (!model || !slider) return;
        const positions = { low: 0, medium: 1, high: 2, xhigh: 3, max: 4, ultra: 5 };
        slider.value = String(positions[effort] ?? 1);
        slider.dispatchEvent(new Event("input", { bubbles: true }));
      });
    }, { once: true });
  </body>
</html>
